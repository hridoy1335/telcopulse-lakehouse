# =============================================================================
# Pipeline 1 - Postgres -> Bronze (batch, JDBC)
# Copies every table in ${var.pg_schema} to <catalog>.<bronze_schema> (same table names).
# Credentials are read at runtime from the Key Vault-backed secret scope as a
# libpq URI stored under ${var.pg_connection_string_key}.
# data_sample_pct controls the deterministic PK-based sample (dev=10, qa=30, prod=100).
# =============================================================================
resources:
  pipelines:
    telcopulse_postgres_bronze:
      name: telcopulse-postgres-bronze-${bundle.target}

      catalog: ${var.catalog_name}
      schema: ${var.bronze_schema}

      root_path: ../../src/pipelines/postgres_bronze
      libraries:
        - glob:
            include: ../../src/pipelines/postgres_bronze/transformations/**

      serverless: true
      photon: true
      channel: current
      continuous: false

      configuration:
        secret_scope: ${var.secret_scope}
        pg_connection_string_key: ${var.pg_connection_string_key}
        pg_schema: ${var.pg_schema}
        bronze_schema: ${var.bronze_schema}
        data_sample_pct: "${var.data_sample_pct}"

# Schedule: see resource/job/telcopulse_job.yml (telcopulse_medallion_orchestration, task postgres_bronze)
