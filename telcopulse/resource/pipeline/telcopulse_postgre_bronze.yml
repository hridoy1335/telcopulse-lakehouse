# =============================================================================
# Pipeline 1 - Postgres -> Bronze (batch, JDBC)
# Copies every table in ${var.pg_schema} to <catalog>.bronze as pg_<table>.
# Credentials are read at runtime from the Key Vault-backed secret scope
# (pg-host, pg-port, pg-database, pg-username, pg-password, pg-sslmode).
# =============================================================================
resources:
  pipelines:
    telcopulse_postgres_bronze:
      name: telcopulse-postgres-bronze-${bundle.target}

      catalog: ${var.catalog_name}
      schema: ${var.bronze_schema}

      root_path: ../../src/pipelines/postgres_bronze
      libraries:
        - glob:
            include: ../../src/pipelines/postgres_bronze/transformations/**

      serverless: true
      photon: true
      channel: current
      continuous: false

      configuration:
        secret_scope: ${var.secret_scope}
        pg_schema: ${var.pg_schema}
        bronze_schema: ${var.bronze_schema}

# Schedule: see resource/job/telcopulse_job.yml (telcopulse_medallion_orchestration, task postgres_bronze)
