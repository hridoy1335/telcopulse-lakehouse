<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
<title id="title">Gold star schema</title><desc id="desc">Five shared dimensions and five facts; foreign-key lookups are applied only where source relationships exist.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071321"/><stop offset="0.55" stop-color="#0A1B2B"/><stop offset="1" stop-color="#07111F"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27D8F2"/><stop offset="1" stop-color="#1678C8"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45E0B4"/><stop offset="1" stop-color="#129C88"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD36E"/><stop offset="1" stop-color="#D88B25"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B39AFF"/><stop offset="1" stop-color="#7461D8"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#24405A" stroke-width="0.7" opacity="0.32"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.55"/></filter>
  <filter id="glowC"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#F4F8FC;letter-spacing:.2px}
    .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#A8BDCE}
    .eyebrow{font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#77DFF0;letter-spacing:2px}
    .cardtitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#F3F8FC}
    .body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#B5C7D6}
    .small{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#91A9BB}
    .tiny{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#9CB2C4;letter-spacing:.7px}
    .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#D9EAF4}
  </style>
</defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/>
<rect width="100%" height="100%" rx="26" fill="url(#grid)"/>
<circle cx="1267" cy="28" r="252" fill="#0B8CBF" opacity="0.055"/>
<circle cx="57" cy="665" r="196" fill="#16BDA5" opacity="0.045"/>
<text x="48" y="52" class="eyebrow">TELCOPULSE / DATA PLATFORM</text>
<text x="48" y="91" class="title">Gold star schema</text>
<text x="48" y="119" class="subtitle">Five shared dimensions and five facts; foreign-key lookups are applied only where source relationships exist.</text>
<text x="48" y="166" class="eyebrow" text-anchor="start">CONFORMED DIMENSIONS</text><rect x="48" y="190" width="230" height="115" rx="15" fill="#0C2A3C" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="163" y="225" class="cardtitle" text-anchor="middle">dim_subscriber</text><text x="163" y="250" class="small" text-anchor="middle">subscribers</text><rect x="115" y="266" width="96" height="24" rx="12" fill="#55C9EF" opacity=".13" stroke="#55C9EF" stroke-opacity=".65"/><text x="163.0" y="282" text-anchor="middle" class="tiny" fill="#55C9EF">SCD TYPE 2</text><rect x="327" y="190" width="230" height="115" rx="15" fill="#0C2A3C" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="442" y="225" class="cardtitle" text-anchor="middle">dim_plan</text><text x="442" y="250" class="small" text-anchor="middle">subscription_plans</text><rect x="394" y="266" width="96" height="24" rx="12" fill="#55C9EF" opacity=".13" stroke="#55C9EF" stroke-opacity=".65"/><text x="442.0" y="282" text-anchor="middle" class="tiny" fill="#55C9EF">SCD TYPE 2</text><rect x="606" y="190" width="230" height="115" rx="15" fill="#0C2A3C" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="721" y="225" class="cardtitle" text-anchor="middle">dim_device</text><text x="721" y="250" class="small" text-anchor="middle">device_registry</text><rect x="673" y="266" width="96" height="24" rx="12" fill="#55C9EF" opacity=".13" stroke="#55C9EF" stroke-opacity=".65"/><text x="721.0" y="282" text-anchor="middle" class="tiny" fill="#55C9EF">SCD TYPE 2</text><rect x="885" y="190" width="230" height="115" rx="15" fill="#0C2A3C" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="1000" y="225" class="cardtitle" text-anchor="middle">dim_cell_site</text><text x="1000" y="250" class="small" text-anchor="middle">cell_sites</text><rect x="952" y="266" width="96" height="24" rx="12" fill="#55C9EF" opacity=".13" stroke="#55C9EF" stroke-opacity=".65"/><text x="1000.0" y="282" text-anchor="middle" class="tiny" fill="#55C9EF">SCD TYPE 2</text><rect x="1164" y="190" width="230" height="115" rx="15" fill="#0C2A3C" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="1279" y="225" class="cardtitle" text-anchor="middle">dim_date</text><text x="1279" y="250" class="small" text-anchor="middle">generated calendar</text><rect x="1231" y="266" width="96" height="24" rx="12" fill="#A995FF" opacity=".13" stroke="#A995FF" stroke-opacity=".65"/><text x="1279.0" y="282" text-anchor="middle" class="tiny" fill="#A995FF">TYPE 0</text><text x="48" y="384" class="eyebrow" text-anchor="start">BUSINESS FACTS</text><rect x="48" y="420" width="230" height="135" rx="15" fill="#211D38" stroke="#7563B7" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="163" y="456" class="cardtitle" text-anchor="middle">fact_subscription</text><text x="163" y="481" class="small" text-anchor="middle">subscriptions</text><text x="163" y="515" class="tiny" text-anchor="middle">1 row / subscription_id</text><rect x="327" y="420" width="230" height="135" rx="15" fill="#211D38" stroke="#7563B7" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="442" y="456" class="cardtitle" text-anchor="middle">fact_invoice</text><text x="442" y="481" class="small" text-anchor="middle">invoices</text><text x="442" y="515" class="tiny" text-anchor="middle">1 row / invoice_id</text><rect x="606" y="420" width="230" height="135" rx="15" fill="#211D38" stroke="#7563B7" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="721" y="456" class="cardtitle" text-anchor="middle">fact_payment</text><text x="721" y="481" class="small" text-anchor="middle">payments</text><text x="721" y="515" class="tiny" text-anchor="middle">1 row / payment_id</text><rect x="885" y="420" width="230" height="135" rx="15" fill="#211D38" stroke="#7563B7" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="1000" y="456" class="cardtitle" text-anchor="middle">fact_support_ticket</text><text x="1000" y="481" class="small" text-anchor="middle">support_tickets</text><text x="1000" y="515" class="tiny" text-anchor="middle">1 row / ticket_id</text><rect x="1164" y="420" width="230" height="135" rx="15" fill="#211D38" stroke="#7563B7" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="1279" y="456" class="cardtitle" text-anchor="middle">fact_network_event</text><text x="1279" y="481" class="small" text-anchor="middle">Event Hub Silver</text><text x="1279" y="515" class="tiny" text-anchor="middle">1 row / Kafka record</text><rect x="48" y="330" width="1344" height="66" rx="14" fill="#0B1C2A" stroke="#29465D" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="72" y="359" class="eyebrow" text-anchor="start">CONFORMED KEY LAYER</text><text x="72" y="383" class="body" text-anchor="start">Facts resolve only the configured dimensions whose foreign-key/date columns are present in the source.</text><rect x="48" y="585" width="1344" height="72" rx="14" fill="#0B1C2A" stroke="#29465D" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="72" y="614" class="eyebrow" text-anchor="start">MODEL CONTRACT</text><text x="72" y="639" class="body" text-anchor="start">SCD2 keys resolve by business key; network events use event-time attribution; snapshot facts use the current dimension member.</text></svg>