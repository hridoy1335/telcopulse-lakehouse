ht="126" rx="16" fill="#0D2132" stroke="#45E0B4" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="1162.5" y="210" class="eyebrow" text-anchor="middle">QA</text><text x="1162.5" y="251" class="title" text-anchor="middle">30%</text><text x="1162.5" y="277" class="small" text-anchor="middle">Promotion after DEV</text><rect x="1250" y="176" width="145" height="126" rx="16" fill="#0D2132" stroke="#F7B955" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="1322.5" y="210" class="eyebrow" text-anchor="middle">PROD</text><text x="1322.5" y="251" class="title" text-anchor="middle">100%</text><text x="1322.5" y="277" class="small" text-anchor="middle">Approval if enabled</text><path d="M834,240 L920,240" fill="none" stroke="#54D8EC" stroke-width="2.2" stroke-linecap="round"/><path d="M913,233 L920,240 L913,247" fill="none" stroke="#54D8EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1075,240 L1080,240" fill="none" stroke="#45E0B4" stroke-width="2.2" stroke-linecap="round"/><path d="M1073,233 L1080,240 L1073,247" fill="none" stroke="#45E0B4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1235,240 L1240,240" fill="none" stroke="#F7B955" stroke-width="2.2" stroke-linecap="round"/><path d="M1233,233 L1240,240 L1233,247" fill="none" stroke="#F7B955" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="366" width="1344" height="75" rx="14" fill="#0B1C2A" stroke="#29465D" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="72" y="396" class="eyebrow" text-anchor="start">SECURITY CONTROLS</text><text x="275" y="396" class="body" text-anchor="start">No long-lived cloud credentials in workflow  •  GitHub Environment variables  •  Per-environment service principals</text><text x="275" y="421" class="small" text-anchor="start">Key Vault-backed Databricks secret scopes  •  Unity Catalog permissions  •  manual PROD approval (when configured)</text></svg>