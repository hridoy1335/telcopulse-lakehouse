# =============================================================================
# TelcoPulse - QA target
#
# Deployed from GitHub Actions (environment: qa) using these GitHub variables:
#   DATABRICKS_HOST       -> QA workspace URL (read by the CLI from the environment;
#                            workspace.host does not support ${var.*} interpolation)
#   DATABRICKS_CLIENT_ID  -> QA SP application ID; map it in the workflow as
#                            BUNDLE_VAR_env_sp_application_id
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#                         -> Azure OIDC login (workflow auth only, not bundle config)
# =============================================================================
targets:

  qa:
    mode: production

    # Shared deployment owned by the deploying service principal (single copy)
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    presets:
      trigger_pause_status: UNPAUSED
      tags:
        project: telcopulse
        environment: qa
        managed_by: databricks_bundle

    run_as:
      service_principal_name: ${var.env_sp_application_id}

    variables:
      catalog_name: telcopulse-qa
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold

      data_sample_pct: 30

      # Key Vault-backed secret scope in the QA workspace (pg-* / eh-* secrets).
      # Must exist in the QA workspace with READ granted to the QA SP.
      secret_scope: telcopulse-qa-kv

      # Cluster configuration
      node_type_id: Standard_D8ds_v5
      min_workers: 2
      max_workers: 4

      # Resolved at deploy time from the SP name (no hardcoded ID).
      # In CI, BUNDLE_VAR_env_sp_application_id (from GitHub var
      # DATABRICKS_CLIENT_ID) overrides this lookup.
      env_sp_application_id:
        lookup:
          service_principal: app-telcopulse-github-qa

    # QA: engineers can view and trigger runs but not edit; only the deploying
    # SP manages resources (changes reach QA through CI only).
    # Top-level CAN_RUN maps to CAN_MANAGE_RUN on jobs and CAN_RUN on pipelines.
    permissions:
      - group_name: de_group
        level: CAN_RUN
      - service_principal_name: ${var.env_sp_application_id}
        level: CAN_MANAGE
