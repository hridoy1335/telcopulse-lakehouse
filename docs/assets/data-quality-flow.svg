<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
<title id="title">Data quality and trust controls</title><desc id="desc">Schema checks, reusable transformations, Lakeflow expectations, and observable rejection metrics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071321"/><stop offset="0.55" stop-color="#0A1B2B"/><stop offset="1" stop-color="#07111F"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27D8F2"/><stop offset="1" stop-color="#1678C8"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45E0B4"/><stop offset="1" stop-color="#129C88"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD36E"/><stop offset="1" stop-color="#D88B25"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B39AFF"/><stop offset="1" stop-color="#7461D8"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#24405A" stroke-width="0.7" opacity="0.32"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.55"/></filter>
  <filter id="glowC"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#F4F8FC;letter-spacing:.2px}
    .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#A8BDCE}
    .eyebrow{font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#77DFF0;letter-spacing:2px}
    .cardtitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#F3F8FC}
    .body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#B5C7D6}
    .small{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#91A9BB}
    .tiny{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#9CB2C4;letter-spacing:.7px}
    .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#D9EAF4}
  </style>
</defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/>
<rect width="100%" height="100%" rx="26" fill="url(#grid)"/>
<circle cx="1267" cy="16" r="144" fill="#0B8CBF" opacity="0.055"/>
<circle cx="57" cy="380" r="112" fill="#16BDA5" opacity="0.045"/>
<text x="48" y="52" class="eyebrow">TELCOPULSE / DATA PLATFORM</text>
<text x="48" y="91" class="title">Data quality and trust controls</text>
<text x="48" y="119" class="subtitle">Schema checks, reusable transformations, Lakeflow expectations, and observable rejection metrics.</text>
<rect x="48" y="185" width="230" height="116" rx="16" fill="#0C2132" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="163" y="216" class="eyebrow" text-anchor="middle">SOURCE SNAPSHOT</text><text x="163" y="248" class="cardtitle" text-anchor="middle">Bronze Delta</text><text x="163" y="274" class="small" text-anchor="middle">8 PostgreSQL tables</text><rect x="330" y="185" width="230" height="116" rx="16" fill="#0C2132" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="445" y="216" class="eyebrow" text-anchor="middle">STANDARDIZE</text><text x="445" y="248" class="cardtitle" text-anchor="middle">Schema + clean</text><text x="445" y="274" class="small" text-anchor="middle">Trim strings • preserve metadata</text><rect x="612" y="185" width="230" height="116" rx="16" fill="#0C2132" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="727" y="216" class="eyebrow" text-anchor="middle">VALIDATE</text><text x="727" y="248" class="cardtitle" text-anchor="middle">Lakeflow DQ</text><text x="727" y="274" class="small" text-anchor="middle">Required keys • configured rules</text><rect x="894" y="185" width="230" height="116" rx="16" fill="#0C2132" stroke="#287A9C" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="1009" y="216" class="eyebrow" text-anchor="middle">PUBLISH</text><text x="1009" y="248" class="cardtitle" text-anchor="middle">Silver outputs</text><text x="1009" y="274" class="small" text-anchor="middle">Valid rows become Silver data</text><path d="M278,243 L320,243" fill="none" stroke="#54D8EC" stroke-width="2.2" stroke-linecap="round"/><path d="M313,236 L320,243 L313,250" fill="none" stroke="#54D8EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M560,243 L602,243" fill="none" stroke="#54D8EC" stroke-width="2.2" stroke-linecap="round"/><path d="M595,236 L602,243 L595,250" fill="none" stroke="#54D8EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M842,243 L884,243" fill="none" stroke="#54D8EC" stroke-width="2.2" stroke-linecap="round"/><path d="M877,236 L884,243 L877,250" fill="none" stroke="#54D8EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M727,301 V337 H1040" fill="none" stroke="#F7B955" stroke-width="2" stroke-dasharray="6 6"/><rect x="1040" y="320" width="350" height="56" rx="12" fill="#2A2117" stroke="#9A6B30" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="1215" y="343" class="tiny" text-anchor="middle" fill="#FFD36E">INVALID RECORDS DROPPED</text><text x="1215" y="362" class="small" text-anchor="middle">Expectation metrics in pipeline event log</text><text x="48" y="360" class="small" text-anchor="start">Policy: drop invalid rows • no separate quarantine or custom DQ audit table is claimed by this implementation.</text></svg>