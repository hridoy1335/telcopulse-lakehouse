    .small{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#91A9BB}
    .tiny{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#9CB2C4;letter-spacing:.7px}
    .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#D9EAF4}
