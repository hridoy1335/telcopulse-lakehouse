<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
<title id="title">End-to-end lakehouse architecture</title><desc id="desc">Two source patterns converge through governed Bronze, Silver, and Gold Lakeflow pipelines.</desc>
<defs>
