<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="510" viewBox="0 0 1440 510" role="img" aria-labelledby="title desc">
<title id="title">Medallion data lifecycle</title><desc id="desc">Snapshot-based operational data and event telemetry are refined independently and published together.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071321"/><stop offset="0.55" stop-color="#0A1B2B"/><stop offset="1" stop-color="#07111F"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27D8F2"/><stop offset="1" stop-color="#1678C8"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45E0B4"/><stop offset="1" stop-color="#129C88"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD36E"/><stop offset="1" stop-color="#D88B25"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B39AFF"/><stop offset="1" stop-color="#7461D8"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#24405A" stroke-width="0.7" opacity="0.32"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.55"/></filter>
  <filter id="glowC"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#F4F8FC;letter-spacing:.2px}
    .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#A8BDCE}
    .eyebrow{font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#77DFF0;letter-spacing:2px}
    .cardtitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#F3F8FC}
    .body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#B5C7D6}
    .small{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#91A9BB}
    .tiny{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#9CB2C4;letter-spacing:.7px}
    .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#D9EAF4}
  </style>
</defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/>
<rect width="100%" height="100%" rx="26" fill="url(#grid)"/>
<circle cx="1267" cy="20" r="183" fill="#0B8CBF" opacity="0.055"/>
<circle cx="57" cy="484" r="142" fill="#16BDA5" opacity="0.045"/>
<text x="48" y="52" class="eyebrow">TELCOPULSE / DATA PLATFORM</text>
<text x="48" y="91" class="title">Medallion data lifecycle</text>
<text x="48" y="119" class="subtitle">Snapshot-based operational data and event telemetry are refined independently and published together.</text>
<rect x="48" y="165" width="400" height="230" rx="20" fill="#091A29" stroke="#29465D" stroke-width="1.3"/><rect x="49" y="166" width="398" height="9" rx="5" fill="#F7B955" opacity=".9"/><text x="72" y="208" class="eyebrow" text-anchor="start">BRONZE</text><text x="72" y="241" class="cardtitle" text-anchor="start">Source-aligned ingestion</text><circle cx="78" cy="277" r="4" fill="#F7B955"/><text x="92" y="281" class="body" text-anchor="start">PostgreSQL: 8 JDBC full snapshots</text><circle cx="78" cy="304" r="4" fill="#F7B955"/><text x="92" y="308" class="body" text-anchor="start">Event Hubs: Kafka raw event stream</text><circle cx="78" cy="331" r="4" fill="#F7B955"/><text x="92" y="335" class="body" text-anchor="start">Delta tables + ingestion metadata</text><circle cx="78" cy="358" r="4" fill="#F7B955"/><text x="92" y="362" class="body" text-anchor="start">DEV 10% • QA 30% • PROD 100%</text><rect x="520" y="165" width="400" height="230" rx="20" fill="#091A29" stroke="#29465D" stroke-width="1.3"/><rect x="521" y="166" width="398" height="9" rx="5" fill="#45E0B4" opacity=".9"/><text x="544" y="208" class="eyebrow" text-anchor="start">SILVER</text><text x="544" y="241" class="cardtitle" text-anchor="start">Cleaned and validated data</text><circle cx="550" cy="277" r="4" fill="#45E0B4"/><text x="564" y="281" class="body" text-anchor="start">PostgreSQL: 8 batch Materialized Views</text><circle cx="550" cy="304" r="4" fill="#45E0B4"/><text x="564" y="308" class="body" text-anchor="start">Event Hub: parsed streaming table</text><circle cx="550" cy="331" r="4" fill="#45E0B4"/><text x="564" y="335" class="body" text-anchor="start">Schema checks, trim, DQ expectations</text><circle cx="550" cy="358" r="4" fill="#45E0B4"/><text x="564" y="362" class="body" text-anchor="start">Invalid rows dropped by policy</text><rect x="992" y="165" width="400" height="230" rx="20" fill="#091A29" stroke="#29465D" stroke-width="1.3"/><rect x="993" y="166" width="398" height="9" rx="5" fill="#A995FF" opacity=".9"/><text x="1016" y="208" class="eyebrow" text-anchor="start">GOLD</text><text x="1016" y="241" class="cardtitle" text-anchor="start">Analytics-ready dimensional model</text><circle cx="1022" cy="277" r="4" fill="#A995FF"/><text x="1036" y="281" class="body" text-anchor="start">4 SCD Type 2 dimensions + dim_date</text><circle cx="1022" cy="304" r="4" fill="#A995FF"/><text x="1036" y="308" class="body" text-anchor="start">4 PostgreSQL snapshot fact tables</text><circle cx="1022" cy="331" r="4" fill="#A995FF"/><text x="1036" y="335" class="body" text-anchor="start">1 event-grain network fact table</text><circle cx="1022" cy="358" r="4" fill="#A995FF"/><text x="1036" y="362" class="body" text-anchor="start">Conformed keys + additive components</text><path d="M456,280 L510,280" fill="none" stroke="#5BD7E8" stroke-width="2.2" stroke-linecap="round"/><path d="M503,273 L510,280 L503,287" fill="none" stroke="#5BD7E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M928,280 L982,280" fill="none" stroke="#5BD7E8" stroke-width="2.2" stroke-linecap="round"/><path d="M975,273 L982,280 L975,287" fill="none" stroke="#5BD7E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="430" width="1344" height="46" rx="13" fill="#0B1C2A" stroke="#29465D" stroke-width="1.4" opacity="1" filter="url(#shadow)"/><text x="72" y="459" class="eyebrow" text-anchor="start">TRIGGERED ORCHESTRATION</text><text x="355" y="459" class="body" text-anchor="start">PostgreSQL Bronze + Event Hub Bronze → Silver → Gold  |  each task waits for upstream success</text></svg>