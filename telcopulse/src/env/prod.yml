# =============================================================================
# TelcoPulse - PROD target
#
# Deployed from GitHub Actions (environment: prod) using these GitHub variables:
#   DATABRICKS_HOST       -> PROD workspace URL (read by the CLI from the environment;
#                            workspace.host does not support ${var.*} interpolation)
#   DATABRICKS_CLIENT_ID  -> PROD SP application ID; map it in the workflow as
#                            BUNDLE_VAR_env_sp_application_id
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#                         -> Azure OIDC login (workflow auth only, not bundle config)
# Recommended: protect the GitHub 'prod' environment with required reviewers.
# =============================================================================
targets:

  prod:
    mode: production

    # Shared deployment owned by the deploying service principal (single copy)
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    presets:
      trigger_pause_status: UNPAUSED
      tags:
        project: telcopulse
        environment: prod
        managed_by: databricks_bundle

    run_as:
      service_principal_name: ${var.env_sp_application_id}

    variables:
      catalog_name: telcopulse-prod
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold

      data_sample_pct: 100

      # Cluster configuration
      node_type_id: Standard_D8ds_v5
      min_workers: 2
      max_workers: 8

      # Resolved at deploy time from the SP name (no hardcoded ID).
      # In CI, BUNDLE_VAR_env_sp_application_id (from GitHub var
      # DATABRICKS_CLIENT_ID) overrides this lookup.
      env_sp_application_id:
        lookup:
          service_principal: app-telcopulse-github-prod

    # Permissions block goes here (recommended: de_group CAN_VIEW, SP CAN_MANAGE)